# 🔁 Redirección obligatoria HTTP → HTTPS
server {
    listen 80;
    server_name avaricia.crudzaso.com;
    return 301 https://$host$request_uri;
}

# 🔐 Servidor HTTPS
server {
    listen 443 ssl;
    server_name avaricia.crudzaso.com;

    # Certificados SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/avaricia.crudzaso.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avaricia.crudzaso.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresión Gzip ---
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # --- Caché agresiva para assets ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- SPA Vue ---
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # --- Backend Spring Boot ---
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Errores ---
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
