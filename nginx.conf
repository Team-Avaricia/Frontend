server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Optimización 1: Compresión Gzip ---
    # Reduce el tamaño de los archivos enviados al navegador
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Optimización 2: Caché para Assets ---
    # Los archivos de Vue en /assets suelen tener hash en el nombre (ej: index.2a3b.js)
    # Podemos cachearlos "para siempre" (1 año) en el navegador del cliente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off; # Desactivar logs de assets ahorra escritura en disco
    }

    # --- Configuración Base para SPA ---
    location / {
        # index.html NO debe cachearse, para que el usuario siempre reciba la última versión
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}