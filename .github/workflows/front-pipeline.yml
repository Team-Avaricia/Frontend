name: Deploy Vue to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/front-vue:latest
          build-args: |
            VITE_AUTH_API_URL=${{ secrets.VITE_AUTH_API_URL }}
            VITE_MAIN_API_URL=${{ secrets.VITE_MAIN_API_URL }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Bajar la imagen nueva ANTES de detener el contenedor (reduce tiempo de caída)
            docker pull ${{ secrets.DOCKER_USERNAME }}/front-vue:latest
            
            # 2. Detener y borrar el contenedor actual
            docker stop front-vue || true
            docker rm front-vue || true
            
            # 3. Correr el nuevo contenedor
            # --restart unless-stopped: Si el VPS se reinicia, tu web arranca sola.
            # --memory="512m": Opcional. Limita la RAM a 512MB (Nginx no necesita más), 
            # protegiendo los otros 3.5GB de tu VPS para la API u otros procesos.
            docker run -d \
              --name front-vue \
              --restart unless-stopped \
              --memory="512m" \
              -p 80:80 \
              ${{ secrets.DOCKER_USERNAME }}/front-vue:latest

            # 4. OPTIMIZACIÓN CRÍTICA: Limpieza
            # Elimina todas las imágenes que quedaron sin uso ("dangling") para liberar espacio
            docker image prune -f